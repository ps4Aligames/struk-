name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Ali Games Service APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_VERSION: '8.7'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-35" || { echo '::error::Android 35 platform tidak tersedia'; exit 1; }
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" || { echo '::error::Build Tools 35.0.0 tidak tersedia'; exit 1; }
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb" || { echo '::error::platform-tools tidak tersedia'; exit 1; }
          java -version
          echo "Android SDK: $ANDROID_SDK_ROOT"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'settings.gradle', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find . -type f -name settings.gradle -print -quit)")"
          [ -n "$PROJECT_DIR" ] || { echo '::error::settings.gradle tidak ditemukan'; exit 1; }
          [ -f "$PROJECT_DIR/app/build.gradle" ] || { echo '::error::app/build.gradle tidak ditemukan'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify launcher and APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo '::error::APK tidak ditemukan'; exit 1; }
          echo "APK: $APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package:|application-label:|launchable-activity:" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliGamesService-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
