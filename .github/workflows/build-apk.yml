name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
          if [ -d "ali_games_service_android" ] && [ -f "ali_games_service_android/gradlew" ]; then
            chmod +x ali_games_service_android/gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -d "ali_games_service_android" ] && [ -f "ali_games_service_android/gradlew" ]; then
            cd ali_games_service_android && ./gradlew assembleDebug --stacktrace
          else
            echo "Gradlew tidak ditemukan. Menjalankan gradle bawaan..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
