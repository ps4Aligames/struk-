name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_VERSION: 8.7
      JAVA_VERSION: '17'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Java:"
          java -version
          echo "Android SDK contents:"
          ls -la "$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-35" || {
            echo "::error::Android SDK platform android-35 is not installed on this runner."
            exit 1
          }

          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" || {
            echo "::error::Android Build Tools 35.0.0 are not installed on this runner."
            exit 1
          }

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb" || {
            echo "::error::Android platform-tools are not installed on this runner."
            exit 1
          }

          echo "Android SDK 35 and Build Tools 35.0.0 are available."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'settings.gradle', 'settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.GRADLE_VERSION }}-

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_DIR="$RUNNER_TEMP/gradle"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf "$GRADLE_DIR"
          mkdir -p "$GRADLE_DIR"

          curl --fail --location --retry 5 --retry-delay 2             -o "$GRADLE_ZIP"             "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q "$GRADLE_ZIP" -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle || {
            echo "::error::settings.gradle tidak ditemukan di root repository."
            exit 1
          }

          test -f build.gradle || {
            echo "::error::build.gradle tidak ditemukan di root repository."
            exit 1
          }

          test -f app/build.gradle || {
            echo "::error::app/build.gradle tidak ditemukan."
            exit 1
          }

          echo "Android project ditemukan."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug             --no-daemon             --stacktrace             --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK tidak berhasil dibuat: $APK"
            exit 1
          }

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliGamesService-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
